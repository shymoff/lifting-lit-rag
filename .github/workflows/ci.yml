name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Run unit tests
        # No Ollama/GPU available here, so llm-marked tests (real embeddings,
        # real generation) are skipped - see README for the CI/local split.
        run: uv run pytest -m unit -v
